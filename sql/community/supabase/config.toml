project_id = "amazingindex-community"

[auth]
enabled = true
site_url = "http://127.0.0.1:4328"
additional_redirect_urls = ["http://127.0.0.1:4328/auth/callback/**"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "1m"
otp_length = 8
otp_expiry = 600

[auth.sms]
enable_signup = false

[functions.meet-photos]
verify_jwt = false # getUser validates the JWT and verified email inside the function.

[functions.meet-public-photos]
verify_jwt = false # Read-only signing of approved, unexpired, explicitly public photos.

[functions.meet-photo-cleanup]
verify_jwt = false # Private cron secret is checked inside the function.

[functions.meet-review]
verify_jwt = false # Custom high-entropy key exchange and expiring HMAC sessions are mandatory.

[functions.meet-api]
verify_jwt = false # Explicit action allowlist and GoTrue JWT validation inside the function.
